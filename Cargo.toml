[workspace]
members = [
    "eventful-rs",
    "eventful-rs-macros",
    "examples/no-main-shard",
    "examples/tokio",
    "examples/sharded-main",
    "examples/targeted-events",
    "examples/connect-all",
]
resolver = "3"

[workspace.package]
authors = ["Sanne Ladage", "eventful-rs contributors"]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

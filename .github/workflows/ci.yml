name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/check.sh
        env:
          SKIP_UI_TESTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep this version in sync with scripts/check-ui.sh.
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev
      - run: sh ./scripts/check-ui.sh
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo check -p eventful-rs --lib --locked
      - run: cargo check -p eventful-rs --lib --features tokio --locked

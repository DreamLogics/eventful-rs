name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check -p eventful-rs --lib --locked
      - run: cargo check -p eventful-rs --lib --no-default-features --locked

[package]
name = "eventful-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage = "https://github.com/DreamLogics/eventful-rs"
repository = "https://github.com/DreamLogics/eventful-rs"
description = "Thread-affine values, typed events, and asynchronous method dispatch for Rust"
readme = "README.md"
documentation = "https://docs.rs/eventful-rs"
keywords = ["events", "async", "actor", "signals", "tokio"]
categories = ["asynchronous", "concurrency"]
include = ["src/**", "tests/**", "README.md", "GUIDE.md", "LICENSE", "Cargo.toml"]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
slint = ["dep:slint"]

[dependencies]
eventful-rs-macros = { version = "0.1.0", path = "../eventful-rs-macros" }
futures = "0.3"
futures-timer = "3"
tokio = { version = "1.48", features = ["sync", "rt", "time", "macros", "net"], optional = true }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2"], optional = true }

[dev-dependencies]
trybuild = "1"

[package.metadata.docs.rs]
all-features = true

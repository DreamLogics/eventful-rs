[package]
name = "eventful-rs-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Procedural macros for eventful-rs typed events and shard dispatch"
readme = "README.md"
documentation = "https://docs.rs/eventful-rs-macros"
keywords = ["events", "async", "macros"]
categories = ["asynchronous", "concurrency"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
